name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish API
        run: dotnet publish src/CampusCore.Api/CampusCore.Api.csproj --configuration Release --output artifacts/api

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build Web/PWA
        working-directory: src/CampusCore.Web
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Package API
        run: tar -C artifacts/api -czf artifacts/campuscore-api-${GITHUB_REF_NAME}.tar.gz .

      - name: Package Web/PWA
        run: tar -C src/CampusCore.Web/dist -czf artifacts/campuscore-web-${GITHUB_REF_NAME}.tar.gz .

      - name: Validate browser companion
        working-directory: src/CampusCore.Extension
        run: npm run check

      - name: Package browser companion
        working-directory: src/CampusCore.Extension
        run: |
          zip -r ../../artifacts/campuscore-companion-${GITHUB_REF_NAME}.zip . \
            -x 'package.json' \
            -x 'validate.mjs' \
            -x 'README.md' \
            -x '*.DS_Store'

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: campuscore-${{ github.ref_name }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "CampusCore ${GITHUB_REF_NAME}"
