name: Release

on:
  push:
    branches: [main]


permissions:
  contents: write
  actions: read

concurrency:
  group: campuscore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >-
      github.ref == 'refs/heads/main' &&
      (startsWith(github.event.head_commit.message, 'chore(release): finalize v1.0.0') ||
       startsWith(github.event.head_commit.message, 'chore(release): rebuild v1.0.0'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit retired support and donation references
        shell: bash
        run: |
          set -euo pipefail
          retired_mailbox="supportramsandesh""@gmail.com"
          retired_donation="buymeacoffee.com/""sanskarIN"
          if git grep -nFi "$retired_mailbox" -- .; then
            echo "::error::Retired support mailbox remains in tracked source."
            exit 1
          fi
          if git grep -nF "$retired_donation" -- .; then
            echo "::error::Outdated donation URL remains in tracked source."
            exit 1
          fi
          git grep -Fq "https://buymeacoffee.com/SanskarCodes" -- README.md .github/FUNDING.yml SUPPORT.md src/CampusCore.Web/src/pages/AboutPage.tsx docs/releases/v1.0.0.md

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify tag and component versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/verify-version.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/verify-version.mjs
          fi
          echo "RELEASE_TAG=v$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET tools and projects
        run: |
          dotnet tool restore
          dotnet restore CampusCore.sln

      - name: Verify .NET formatting
        run: dotnet format CampusCore.sln --verify-no-changes --no-restore

      - name: Build .NET release
        run: dotnet build CampusCore.sln --configuration Release --no-restore -warnaserror

      - name: Run .NET tests
        run: dotnet test CampusCore.sln --configuration Release --no-build

      - name: Publish API
        run: dotnet publish src/CampusCore.Api/CampusCore.Api.csproj --configuration Release --no-restore --output artifacts/api

      - name: Package self-contained API server executables
        shell: bash
        run: |
          set -euo pipefail
          for rid in linux-x64 win-x64 osx-arm64; do
            dotnet publish src/CampusCore.Api/CampusCore.Api.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:PublishTrimmed=false \
              -p:DebugType=None \
              -p:DebugSymbols=false \
              --output "artifacts/publish/$rid"
            if [[ "$rid" == win-* ]]; then
              test -s "artifacts/publish/$rid/CampusCore.Api.exe"
              (cd "artifacts/publish/$rid" && zip -qr "../../campuscore-api-${RELEASE_TAG}-$rid.zip" .)
            else
              test -x "artifacts/publish/$rid/CampusCore.Api"
              tar -C "artifacts/publish/$rid" -czf "artifacts/campuscore-api-${RELEASE_TAG}-$rid.tar.gz" .
            fi
          done

      - name: Generate idempotent migration SQL
        run: |
          dotnet ef migrations script --idempotent \
            --no-build \
            --configuration Release \
            --project src/CampusCore.Infrastructure \
            --startup-project src/CampusCore.Api \
            --output artifacts/migrations.sql
          test -s artifacts/migrations.sql

      - name: Build and verify Web/PWA release assets
        working-directory: src/CampusCore.Web
        shell: bash
        run: |
          npm install --no-audit --no-fund
          version="$(cat ../../VERSION)"
          VITE_API_BASE_URL=/ VITE_APP_VERSION="$version" npm run check
          npm run verify:release

      - name: Validate public funding and contact in built Web/PWA
        shell: bash
        run: |
          set -euo pipefail
          grep -RFl 'https://buymeacoffee.com/SanskarCodes' src/CampusCore.Web/dist/assets >/dev/null
          retired_mailbox="supportramsandesh""@gmail.com"
          retired_donation="buymeacoffee.com/""sanskarIN"
          if grep -RFi "$retired_mailbox" src/CampusCore.Web/dist; then
            echo "::error::Retired support mailbox found in packaged Web/PWA."
            exit 1
          fi
          if grep -RF "$retired_donation" src/CampusCore.Web/dist; then
            echo "::error::Outdated donation URL found in packaged Web/PWA."
            exit 1
          fi

      - name: Package API
        run: tar -C artifacts/api -czf artifacts/campuscore-api-${RELEASE_TAG}.tar.gz .

      - name: Package Web/PWA
        run: tar -C src/CampusCore.Web/dist -czf artifacts/campuscore-web-${RELEASE_TAG}.tar.gz .

      - name: Validate browser companion
        working-directory: src/CampusCore.Extension
        run: npm run check

      - name: Package browser companion
        working-directory: src/CampusCore.Extension
        run: |
          zip -r ../../artifacts/campuscore-companion-${RELEASE_TAG}.zip . \
            -x 'package.json' \
            -x 'validate.mjs' \
            -x 'README.md' \
            -x '*.DS_Store'

      - name: Setup Java for Android verification
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Android project from tagged source
        working-directory: src/CampusCore.Web
        shell: bash
        env:
          VITE_API_BASE_URL: https://api.example.test
        run: |
          version="$(cat ../../VERSION)"
          VITE_APP_VERSION="$version" npm run build:android
          npx cap add android
          npx cap sync android

      - name: Assemble Android verification APK
        working-directory: src/CampusCore.Web/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android verification APK
        uses: actions/upload-artifact@v7
        with:
          name: campuscore-android-verification-${{ github.ref_name }}
          path: src/CampusCore.Web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Include Android test-only APK in release artifacts
        shell: bash
        run: |
          cp src/CampusCore.Web/android/app/build/outputs/apk/debug/app-debug.apk "artifacts/campuscore-android-${RELEASE_TAG}-debug-TEST-ONLY.apk"
          test -s "artifacts/campuscore-android-${RELEASE_TAG}-debug-TEST-ONLY.apk"

      - name: Add version manifest to release artifacts
        run: cp VERSION artifacts/VERSION

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip *.apk migrations.sql VERSION > SHA256SUMS.txt

      - name: Verify package integrity before publishing
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          for archive in *.tar.gz; do tar -tzf "$archive" >/dev/null; done
          for archive in *.zip; do unzip -tq "$archive" >/dev/null; done
          unzip -Z1 "campuscore-api-${RELEASE_TAG}-win-x64.zip" | grep -Fx 'CampusCore.Api.exe'
          tar -tzf "campuscore-api-${RELEASE_TAG}-linux-x64.tar.gz" | grep -Fx './CampusCore.Api'
          tar -tzf "campuscore-api-${RELEASE_TAG}-osx-arm64.tar.gz" | grep -Fx './CampusCore.Api'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: campuscore-${{ github.ref_name }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.apk
            artifacts/migrations.sql
            artifacts/VERSION
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Gate replacement release on all required GitHub Actions checks
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=("CI" "CodeQL" "Deployment Smoke" "Full-stack E2E" "Performance Budget" "Android" "Version Consistency")
          verified=0
          for attempt in {1..50}; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            pending=()
            for workflow in "${required[@]}"; do
              conclusion="$(jq -r --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow)] | first | .conclusion // "pending"' <<<"$runs")"
              if [[ "$conclusion" != success ]]; then
                pending+=("$workflow=$conclusion")
              fi
            done
            if (( ${#pending[@]} == 0 )); then
              verified=1
              break
            fi
            echo "Release gate pending or failing: ${pending[*]}"
            if [[ "${pending[*]}" == *failure* ]]; then
              echo "::error::A required workflow failed; refusing to tag an unverified build."
              exit 1
            fi
            sleep 30
          done
          if (( verified != 1 )); then
            echo "::error::Required workflows did not all complete successfully."
            exit 1
          fi

      - name: Replace published release and annotate corrected tag after checks pass
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name Sanskar
          git config user.email sanskarin@outlook.in

          # Never delete or modify an existing release until all artifact integrity
          # checks and all seven required same-commit workflow checks have passed.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          fi

          git tag -a "${RELEASE_TAG}" -m "CampusCore ${RELEASE_TAG} - corrected funding and contacts"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release with executable assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -ge 9
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Old release still exists: refusing to upload mismatched assets."
            exit 1
          fi
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --verify-tag \
            --notes-file "docs/releases/${RELEASE_TAG}.md" \
            --title "CampusCore ${RELEASE_TAG}"
