name: Deployment Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/CampusCore.Api/**'
      - 'src/CampusCore.Infrastructure/**'
      - 'src/CampusCore.Web/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/deployment-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/CampusCore.Api/**'
      - 'src/CampusCore.Infrastructure/**'
      - 'src/CampusCore.Web/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/deployment-smoke.yml'

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-compose:
    name: Production Compose startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_PASSWORD: ci-production-database-password-7d89b6f3
      CAMPUSCORE_JWT_KEY: ci-production-jwt-signing-key-5b9150b52dbf4b999245d0c1459a42f4
      CAMPUSCORE_BOOTSTRAP_KEY: ci-production-bootstrap-key-4e7365126fa24c3a
      CAMPUSCORE_ALLOWED_HOSTS: 127.0.0.1;localhost
      CAMPUSCORE_CORS_ORIGIN_0: https://app.example.test
      CAMPUSCORE_CORS_ORIGIN_1: https://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production Compose interpolation
        run: docker compose config --quiet

      - name: Build and start production-mode stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Verify liveness and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:5080/healthz
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:5080/readyz
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8081/healthz
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8081/readyz
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8081/ >/dev/null

      - name: Verify containers are non-root where expected
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker compose exec -T api id -un | tr -d '\r')" = "campuscore"
          test "$(docker compose exec -T web id -un | tr -d '\r')" != "root"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down production smoke stack
        if: always()
        run: docker compose down -v --remove-orphans
