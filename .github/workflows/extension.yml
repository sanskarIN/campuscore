name: Browser extension

on:
  push:
    branches: [main]
    paths:
      - 'src/CampusCore.Extension/**'
      - '.github/workflows/extension.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/CampusCore.Extension/**'
      - '.github/workflows/extension.yml'

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package Manifest V3 companion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/CampusCore.Extension
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate extension
        run: npm run check

      - name: Package extension
        run: |
          mkdir -p ../../artifacts
          zip -r ../../artifacts/campuscore-companion.zip . \
            -x 'package.json' \
            -x 'validate.mjs' \
            -x 'README.md' \
            -x '*.DS_Store'

      - name: Upload extension package
        uses: actions/upload-artifact@v6
        with:
          name: campuscore-companion
          path: artifacts/campuscore-companion.zip
          if-no-files-found: error
          retention-days: 7
