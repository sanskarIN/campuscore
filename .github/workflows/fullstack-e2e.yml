name: Full-stack E2E

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'src/CampusCore.Api/**'
      - 'src/CampusCore.Application/**'
      - 'src/CampusCore.Domain/**'
      - 'src/CampusCore.Infrastructure/**'
      - 'src/CampusCore.Web/**'
      - 'docker-compose.yml'
      - '.github/workflows/fullstack-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'src/CampusCore.Api/**'
      - 'src/CampusCore.Application/**'
      - 'src/CampusCore.Domain/**'
      - 'src/CampusCore.Infrastructure/**'
      - 'src/CampusCore.Web/**'
      - 'docker-compose.yml'
      - '.github/workflows/fullstack-e2e.yml'

permissions:
  contents: read

concurrency:
  group: fullstack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Real browser release-candidate journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: campuscore-fullstack-database-password
      CAMPUSCORE_BOOTSTRAP_KEY: campuscore-fullstack-bootstrap-key-2026
      CAMPUSCORE_E2E_BASE_URL: http://127.0.0.1:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Web test dependencies
        working-directory: src/CampusCore.Web
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: src/CampusCore.Web
        run: npx playwright install --with-deps chromium

      - name: Build and start disposable CampusCore stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run real full-stack browser journey
        working-directory: src/CampusCore.Web
        run: npm run test:e2e:fullstack

      - name: Upload full-stack Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: campuscore-fullstack-playwright-report
          path: src/CampusCore.Web/playwright-fullstack-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload full-stack browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: campuscore-fullstack-playwright-results
          path: src/CampusCore.Web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down disposable stack
        if: always()
        run: docker compose down -v --remove-orphans
