name: Version Consistency

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'Directory.Build.props'
      - 'docker-compose.yml'
      - '.env.example'
      - 'src/CampusCore.Web/package.json'
      - 'src/CampusCore.Web/src/env.ts'
      - 'src/CampusCore.Extension/package.json'
      - 'src/CampusCore.Extension/manifest.json'
      - 'scripts/verify-version.mjs'
      - '.github/workflows/version.yml'
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'Directory.Build.props'
      - 'docker-compose.yml'
      - '.env.example'
      - 'src/CampusCore.Web/package.json'
      - 'src/CampusCore.Web/src/env.ts'
      - 'src/CampusCore.Extension/package.json'
      - 'src/CampusCore.Extension/manifest.json'
      - 'scripts/verify-version.mjs'
      - '.github/workflows/version.yml'

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release version alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify aligned version
        run: node scripts/verify-version.mjs
