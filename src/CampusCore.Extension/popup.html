<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CampusCore Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <main class="popup-shell" aria-labelledby="popup-title">
    <header class="brand-row">
      <div class="brand-mark" aria-hidden="true">CC</div>
      <div>
        <h1 id="popup-title">CampusCore</h1>
        <p>Companion</p>
      </div>
    </header>

    <p id="connection-status" class="status" role="status">Loading configuration…</p>

    <nav class="quick-links" aria-label="CampusCore shortcuts">
      <button type="button" data-route="">Open dashboard</button>
      <button type="button" data-route="students">Students</button>
      <button type="button" data-route="search">Global search</button>
      <button type="button" data-route="announcements">Announcements</button>
    </nav>

    <button id="open-settings" class="secondary" type="button">Extension settings</button>
    <p class="credit">Made by the Sanskar</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
