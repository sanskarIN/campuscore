services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuscore}
      POSTGRES_USER: ${POSTGRES_USER:-campuscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuscore-local-only}
    ports:
      - "${CAMPUSCORE_DB_BIND:-127.0.0.1}:${CAMPUSCORE_DB_PORT:-5432}:5432"
    volumes:
      - campuscore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CampusCore.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-campuscore};Username=${POSTGRES_USER:-campuscore};Password=${POSTGRES_PASSWORD:-campuscore-local-only}
      Jwt__Issuer: ${CAMPUSCORE_JWT_ISSUER:-CampusCore}
      Jwt__Audience: ${CAMPUSCORE_JWT_AUDIENCE:-CampusCore.Web}
      Jwt__Key: ${CAMPUSCORE_JWT_KEY:-campuscore-compose-development-only-change-before-production-123456789}
      BootstrapAdmin__Key: ${CAMPUSCORE_BOOTSTRAP_KEY:-campuscore-compose-bootstrap-local-only}
      AllowedHosts: ${CAMPUSCORE_ALLOWED_HOSTS:-*}
      Cors__Origins__0: ${CAMPUSCORE_CORS_ORIGIN_0:-http://localhost:5173}
      Cors__Origins__1: ${CAMPUSCORE_CORS_ORIGIN_1:-https://localhost}
      Storage__RootPath: /data/uploads
    ports:
      - "${CAMPUSCORE_API_BIND:-127.0.0.1}:${CAMPUSCORE_API_PORT:-5080}:8080"
    volumes:
      - campuscore-uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: src/CampusCore.Web/Dockerfile
      args:
        VITE_API_BASE_URL: /
        VITE_APP_VERSION: ${CAMPUSCORE_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CAMPUSCORE_WEB_BIND:-127.0.0.1}:${CAMPUSCORE_WEB_PORT:-8081}:8080"

volumes:
  campuscore-postgres:
  campuscore-uploads:
